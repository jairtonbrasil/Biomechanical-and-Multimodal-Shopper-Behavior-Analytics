# Media control and RTSP stay inside the Compose service network.
logLevel: error
logDestinations: [file]
logFile: /dev/null
api: true
apiAddress: :9997
authMethod: internal
# Deployment credentials and their scoped permissions are supplied through
# MTX_AUTHINTERNALUSERS, never stored in this versioned configuration.
authInternalUsers: []
rtspTransports: [tcp]
rtmp: false
srt: false
hls: true
hlsAddress: :8888
hlsAlwaysRemux: true
hlsVariant: fmp4
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsAllowOrigins: []
webrtc: false
paths:
  demo/iprox:
    source: publisher
  demo/retail:
    source: publisher
