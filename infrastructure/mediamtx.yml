logLevel: warn
logStructured: true
api: true
apiAddress: 127.0.0.1:9997
authMethod: internal
authInternalUsers:
  - user: any
    ips: [127.0.0.1, '::1']
    permissions:
      - action: api
rtspTransports: [tcp]
rtmp: false
srt: false
hls: true
webrtc: true
# No camera or anonymous media permissions are provisioned before D06/T037.
paths: {}
