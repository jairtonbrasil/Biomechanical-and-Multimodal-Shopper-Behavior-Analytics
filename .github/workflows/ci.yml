name: Backend verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install verification dependencies
        run: python -m pip install -r backend/requirements-dev.lock

      - name: Check source quality
        run: |
          ruff check backend scripts infrastructure/demo_publish.py
          ruff format --check backend scripts infrastructure/demo_publish.py
          python scripts/check_notebook.py

      - name: Run unit tests
        working-directory: backend
        run: python -m pytest -q

      - name: Configure isolated local services
        id: configure
        run: |
          python scripts/configure_local.py
          docker compose config --quiet

      - name: Run service integration tests
        run: docker compose --profile verification run --build --rm tests

      - name: Stop verification services
        if: always() && steps.configure.outcome == 'success'
        run: docker compose down --remove-orphans
